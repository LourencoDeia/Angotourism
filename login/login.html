<!DOCTYPE html>
<html lang="PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="Css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
</head>
<body>
    <div class="wrapper">
            <form action="">
            <h1>Login</h1>
            <div class="input-box">
            <input type="text" placeholder="Nome de usuário" required>
            <i class='bx bxs-user'></i>
            </div>
            
            <div class="input-box">
                <input type="password" placeholder="Palavra-passe" required>
                <i class='bx bxs-lock-alt'></i>
                </div>

                <div class="remember-forgot">
                    <label><Input type="checkbox">Lembrar-me</Input>
                    </label>
                    <a href="#">Esqueceste a Palavra-passe?</a>
                </div>
                
                <button type="submit" class="btn"><a href="/index.html" class="btn-ent">Entrar</a></button>
                <div class="register-link">
                    <p>
                        Eu não tenho uma conta <a href="../Formulário-2/index.html">Cadastrar</a>
                    </p>
                </div>

            </form>
    </div>
    
</body>
</html>
